<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>印象派語音繪本</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: #f5f5f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background: white;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 500px;
            width: 100%;
        }
        button {
            background-color: #0071e3;
            color: white;
            border: none;
            padding: 15px 30px;
            font-size: 18px;
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 20px;
        }
        button:active {
            transform: scale(0.95);
        }
        #status {
            margin: 15px 0;
            font-size: 16px;
            color: #555;
            min-height: 24px;
        }
        #img-container {
            width: 100%;
            height: 350px;
            background-color: #eee;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            margin-top: 15px;
        }
        #result-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: none;
        }
        .placeholder-text {
            color: #888;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>🎨 印象派繪本生成器</h2>
    <button id="mic-btn">🎤 開始說話</button>
    <div id="status">按下按鈕並說出一句話...</div>
    
    <div id="img-container">
        <span class="placeholder-text" id="placeholder">生成的繪本會顯示在這裡</span>
        <img id="result-img" alt="繪本成果" />
    </div>
</div>

<script>
    const micBtn = document.getElementById('mic-btn');
    const statusText = document.getElementById('status');
    const resultImg = document.getElementById('result-img');
    const placeholder = document.getElementById('placeholder');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!SpeechRecognition) {
        statusText.innerText = "您的瀏覽器不支援語音辨識，請使用 Safari。";
    } else {
        const recognition = new SpeechRecognition();
        recognition.lang = 'zh-TW';

        micBtn.onclick = () => {
            recognition.start();
            statusText.innerText = "正在聆聽中...";
            micBtn.style.backgroundColor = "#ff3b30";
        };

        recognition.onresult = async (event) => {
            micBtn.style.backgroundColor = "#0071e3";
            const transcript = event.results[0][0].transcript;
            statusText.innerText = `辨識成功：「${transcript}」，畫作繪製中...`;

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: transcript })
                });

                const data = await response.json();

                if (response.ok && data.imageUrl) {
                    resultImg.src = data.imageUrl;
                    resultImg.style.display = 'block';
                    placeholder.style.display = 'none';
                    statusText.innerText = "✨ 繪本生成成功！";
                } else {
                    statusText.innerText = `❌ 失敗：${data.error || '無法取得圖片'}`;
                }
            } catch (err) {
                statusText.innerText = `❌ 網路連線錯誤：${err.message}`;
            }
        };

        recognition.onerror = (event) => {
            micBtn.style.backgroundColor = "#0071e3";
            statusText.innerText = "語音辨識出錯，請再試一次。";
        };
    }
</script>

</body>
</html>
